name: Release

# Builds an installer for each platform and attaches it to a GitHub release, so that
# installing does not mean installing Rust, CMake, Node and a C++ toolchain first.
#
# Trigger by pushing a tag that matches the version in Cargo.toml:
#
#     scripts/version.sh minor && git commit -am "Release" && git tag v0.2.0 && git push --tags
on:
  push:
    tags: ['v*']
  # So the build can be proved without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not throw away an installer that did build.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS (Apple Silicon)
          - platform: macos-13
            target: x86_64-apple-darwin
            name: macOS (Intel)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # whisper.cpp is built from source by whisper-rs-sys and needs CMake. The macOS
      # and Windows runners already carry a C/C++ toolchain.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      # The three files that carry the version have to agree before one of them ends up
      # printed on an installer.
      - name: Check the version is consistent
        run: cargo test -p dndsound --test version

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Only a tag publishes anything. tauri-action creates a release whenever
          # tagName is set, and on a manual run github.ref_name is the branch — which
          # would produce a release tagged "main". A manual run builds and keeps the
          # installers as artifacts instead, which is how the build gets proved without
          # committing to a version.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('dndsound {0}', github.ref_name) || '' }}
          releaseDraft: true
          releaseBody: |
            Завантаж файл для своєї системи і встанови.

            **macOS** — `.dmg`. Перетягни програму в «Програми». Збірка не підписана,
            тому при першому запуску система скаже, що не може перевірити розробника:
            **Системні параметри → Конфіденційність і безпека**, прогорни донизу і
            натисни **Усе одно відкрити**. Якщо каже «пошкоджено», у Терміналі:
            `xattr -dr com.apple.quarantine /Applications/dndsound.app`

            **Windows** — `.msi` або `.exe`. Збірка не підписана, тому SmartScreen
            покаже попередження: **Додатково → Виконати в будь-якому разі**.

            При першому запуску програма завантажить моделі розпізнавання (близько
            575 МБ) і набір звуків (13 МБ). Після цього інтернет не потрібен.

      - name: Keep the installers from a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dndsound-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
