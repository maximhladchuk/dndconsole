[package]
name = "dndsound-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cpal = "0.18"
# Pinned exactly: ort is at release candidate and two rc versions cannot coexist,
# because each links its own copy of ONNX Runtime.
ort = "=2.0.0-rc.13"
dndsound-models.workspace = true
rubato = "5"
audioadapter-buffers = "5"
hound.workspace = true
rtrb = "0.4"
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# whisper.cpp's GPU backend is chosen per platform, because the feature that makes it
# fast on one is a build failure on another: `metal` does not exist off Apple platforms.
# Windows and Linux fall back to the CPU backend, which works and is slower — Vulkan or
# CUDA would be the next step and neither can be verified from this machine.
#
# Core ML is deliberately not enabled on macOS: it would add a 1.1 GB download for the
# encoder alone, and the Metal path is fast enough.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16" }

[dev-dependencies]
hound.workspace = true
serde_json.workspace = true
